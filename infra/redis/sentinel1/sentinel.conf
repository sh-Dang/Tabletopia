port 26379
bind 0.0.0.0
protected-mode no

# Docker에서는 hostname 기반만 사용
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Master 모니터링 (컨테이너 이름)
sentinel monitor mymaster 172.19.0.2 6379 2
sentinel auth-pass mymaster yourpassword

# Redis 인증

# 장애 판단 / 페일오버 설정
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000

# Generated by CONFIG REWRITE
dir "/data"
latency-tracking-info-percentiles 50 99 99.9
user default on nopass sanitize-payload ~* &* +@all
sentinel myid f51bd3dc4ac2e38bb3f99301206260a7d643692c
sentinel config-epoch mymaster 4
sentinel leader-epoch mymaster 4
sentinel current-epoch 4

sentinel known-replica mymaster 172.19.0.3 6379

sentinel known-sentinel mymaster 172.19.0.6 26379 957b87b61cdb836fc266c587fb374c703a14421e

sentinel known-sentinel mymaster 172.19.0.4 26379 20b19d33c4dc6c23357463f800112021af193a4e

